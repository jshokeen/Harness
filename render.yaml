services:
  - type: web
    name: harness
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
